services:
  brecontas:
    build: .
    container_name: brecontas
    restart: unless-stopped
    ports:
      # Somente localhost: o acesso publico e' pelo Caddy (TLS + secure_headers).
      - "127.0.0.1:3100:3000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    env_file:
      - .env.production
    environment:
      - DATABASE_PATH=/app/data/brecontas.db
      # Datas relativas ("hoje"/"ontem") sao resolvidas no fuso do dominio.
      - TZ=America/Sao_Paulo
    mem_limit: 512m
    healthcheck:
      # A imagem slim nao tem curl nem wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
